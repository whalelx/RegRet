# fine tuning on the qwen models trained by vpt data
### model
model_name_or_path: saves/staug/large/checkpoint-3000

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: staug_stage2
template: qwen2_vl_vpt

cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 6

### output
output_dir: saves/staug/large-stage2-format-fullysame
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
# save_model_only: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
report_to: tensorboard
