### model
# model_name_or_path: saves/staug/osdmix450k/checkpoint-2000
model_name_or_path: saves/staug/osdmixcot450k/checkpoint-3521
template: qwen2_vl
# customize_model_class: staug
para_mask_id: 0
para_mask_ratio: 0.0
vision_encoder_ls: clip

### method
stage: sft
do_predict: true
finetuning_type: freeze
freefreeze_frozen_modules: "all"

### dataset
