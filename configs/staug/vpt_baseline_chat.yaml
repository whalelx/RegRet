### model
model_name_or_path: rp-yu/Qwen2-VL-7b-VPT-CLIP #Qwen/Qwen2-VL-7B-Instruct
template: qwen2_vl
customize_model_class: vpt # must be set as this for our model, must be set None for original qwen
num_inner_forward_run: 2
para_mask_id: 0
para_mask_ratio: 0.0
vision_encoder_ls: clip

### method
stage: sft
do_predict: true
finetuning_type: freefreeze
freefreeze_frozen_modules: "all"

### dataset
eval_dataset: eval_dataset
template: qwen2_vl_vpt
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /output
overwrite_output_dir: true

### eval
per_device_eval_batch_size: 16
predict_with_generate: true
ddp_timeout: 180000000